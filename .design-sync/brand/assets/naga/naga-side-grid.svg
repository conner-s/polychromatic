    <g id="key-7" data-key="7"><rect x="30" y="154" width="56" height="56" fill="#323232" stroke="#2D2D2D" stroke-width="2"/><text x="58" y="182" fill="#00FF00">7</text></g>
    <g id="key-8" data-key="8"><rect x="92" y="154" width="56" height="56" fill="#323232" stroke="#2D2D2D" stroke-width="2"/><text x="120" y="182" fill="#00FF00">8</text></g>
