<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="240" height="300" font-family="Play, sans-serif">
  <!-- Schematic of a Naga-style 12-button thumb grid (3 columns x 4 rows).
       Not a traced device outline; verify layout against your own unit.
       Each key is <g id="key-N" data-key="N"> so designs can target it. -->
