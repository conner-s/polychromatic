<!doctype html>
<html><head><meta charset="utf-8">
  <title>Table</title>
  <link rel="stylesheet" href="../../../styles.css">
  <style>
    body { margin: 0; padding: 20px; background: #000; }
    .ref { margin-top: 20px; border-top: 1px dashed #2D2D2D; padding-top: 10px; }
    .ref p { margin: 0 0 6px; color: #828282; font-size: 12px; }
    .ref img { display: block; max-width: 100%; }
  </style>
</head>
<body class="pc-app">
<table class="pc-table" style="max-width:520px">
  <thead><tr><th style="width:160px">Button</th><th>Action</th></tr></thead>
  <tbody>
    <tr><td>Thumb 1</td><td>Keyboard: 1</td></tr>
    <tr><td>Thumb 2</td><td>Keyboard: 2</td></tr>
    <tr aria-selected="true"><td>Thumb 3</td><td>Macro: Burst</td></tr>
    <tr><td>Side Back</td><td>Mouse Button 4</td></tr>
    <tr class="is-disabled"><td>Thumb 12</td><td>Unassigned</td></tr>
  </tbody>
</table>
<p class="pc-muted">Black base, #1A1A1A alternate rows, #262626 hover, #008000 selected row with white text. Header sections #323232.</p>
</body></html>
