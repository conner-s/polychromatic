<!doctype html>
<html><head><meta charset="utf-8">
  <title>Effect button</title>
  <link rel="stylesheet" href="../../../styles.css">
  <style>
    body { margin: 0; padding: 20px; background: #000; }
    .ref { margin-top: 20px; border-top: 1px dashed #2D2D2D; padding-top: 10px; }
    .ref p { margin: 0 0 6px; color: #828282; font-size: 12px; }
    .ref img { display: block; max-width: 100%; }
  </style>
</head>
<body class="pc-app">
<section class="pc-group"><h3 class="pc-group__title">Effect buttons</h3>
  <div class="pc-row"><div class="pc-row__label">Effect</div><div class="pc-row__controls">
    <button class="pc-effect-btn" aria-pressed="true"><img src="../../../assets/img/options/wave.svg" alt="">Wave</button>
    <button class="pc-effect-btn" aria-pressed="false"><img src="../../../assets/img/options/spectrum.svg" alt="">Spectrum</button>
    <button class="pc-effect-btn" aria-pressed="false"><img src="../../../assets/img/options/static.svg" alt="">Static</button>
    <button class="pc-effect-btn" aria-pressed="false"><img src="../../../assets/img/options/starlight.svg" alt="">Starlight</button>
    <button class="pc-effect-btn" disabled><img src="../../../assets/img/options/ripple.svg" alt="">Ripple</button>
  </div></div>
</section>
<p class="pc-muted" style="margin:12px 30px">Exclusive choice of a mode. 105&times;70 min, 40px green icon above the label; checked = #008000 fill.</p>
</body></html>
